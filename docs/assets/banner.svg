  <text x="210" y="130" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="52" font-weight="700" fill="#111827">Pitstop Oracle</text>
  <text x="210" y="175" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="500" fill="#6b7280">ML-powered F1 race-winner predictions</text>
  <text x="210" y="210" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#9ca3af">Historical results · Streamlit dashboard · scikit-learn</text>
