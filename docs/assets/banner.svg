<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Pitstop Oracle">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f8fafc"/>
    </linearGradient>
    <pattern id="checkers" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#f3f4f6"/>
      <rect x="12" y="12" width="12" height="12" fill="#f3f4f6"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="8" fill="#e10600"/>
  <rect x="0" y="292" width="1200" height="8" fill="#e10600"/>
  <rect x="900" y="40" width="260" height="220" fill="url(#checkers)" opacity="0.5"/>
  <circle cx="120" cy="150" r="56" fill="none" stroke="#e10600" stroke-width="6"/>
